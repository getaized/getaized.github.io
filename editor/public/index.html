<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jekyll Blog Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <nav class="sidebar">
      <div class="sidebar-header">
        <svg class="logo-icon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
          <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
          <path d="M2 2l7.586 7.586"></path>
          <circle cx="11" cy="11" r="2"></circle>
        </svg>
        <span class="logo-text">Editor</span>
      </div>
      
      <div class="sidebar-section">
        <h3 class="sidebar-title">Posts</h3>
        <div id="postsList" class="posts-list"></div>
      </div>
    </nav>

    <main class="main-content">
      <header class="editor-header">
        <div class="header-left">
          <h1 class="page-title">New Post</h1>
          <p class="page-subtitle">Create and publish blog content</p>
        </div>
        <div class="header-actions">
          <button id="previewBtn" class="btn btn-secondary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            Preview
          </button>
          <button id="publishBtn" class="btn btn-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Publish
          </button>
        </div>
      </header>

      <div class="editor-container">
        <div class="form-section">
          <div class="form-group">
            <label for="postTitle">Title</label>
            <input type="text" id="postTitle" placeholder="Enter post title" />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="postDate">Date</label>
              <input type="datetime-local" id="postDate" />
            </div>

            <div class="form-group">
              <label for="postTags">Tags</label>
              <input type="text" id="postTags" placeholder="technology, tutorial" />
            </div>
          </div>
        </div>

        <div class="editor-wrapper">
          <div class="toolbar">
            <div class="toolbar-group">
              <button class="toolbar-btn" data-command="bold" title="Bold">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path>
                  <path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path>
                </svg>
              </button>
              <button class="toolbar-btn" data-command="italic" title="Italic">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="19" y1="4" x2="10" y2="4"></line>
                  <line x1="14" y1="20" x2="5" y2="20"></line>
                  <line x1="15" y1="4" x2="9" y2="20"></line>
                </svg>
              </button>
              <button class="toolbar-btn" data-command="underline" title="Underline">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M6 3v7a6 6 0 0 0 6 6 6 6 0 0 0 6-6V3"></path>
                  <line x1="4" y1="21" x2="20" y2="21"></line>
                </svg>
              </button>
              <button class="toolbar-btn" data-command="strikeThrough" title="Strikethrough">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M16 4H9a3 3 0 0 0-3 3v0a3 3 0 0 0 3 3h6"></path>
                  <path d="M15 20H8a3 3 0 0 1-3-3v0a3 3 0 0 1 3-3h6"></path>
                  <line x1="4" y1="12" x2="20" y2="12"></line>
                </svg>
              </button>
            </div>

            <div class="toolbar-divider"></div>

            <div class="toolbar-group">
              <button class="toolbar-btn" data-command="formatBlock" data-value="h1" title="Heading 1">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M4 12h8"></path>
                  <path d="M4 18V6"></path>
                  <path d="M12 18V6"></path>
                </svg>
              </button>
              <button class="toolbar-btn" data-command="formatBlock" data-value="h2" title="Heading 2">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M4 12h6"></path>
                  <path d="M4 18V6"></path>
                  <path d="M10 18V6"></path>
                </svg>
              </button>
              <button class="toolbar-btn" data-command="formatBlock" data-value="h3" title="Heading 3">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M4 12h4"></path>
                  <path d="M4 18V6"></path>
                  <path d="M8 18V6"></path>
                </svg>
              </button>
            </div>

            <div class="toolbar-divider"></div>

            <div class="toolbar-group">
              <button class="toolbar-btn" data-command="insertUnorderedList" title="Bullet List">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="8" y1="6" x2="21" y2="6"></line>
                  <line x1="8" y1="12" x2="21" y2="12"></line>
                  <line x1="8" y1="18" x2="21" y2="18"></line>
                  <line x1="3" y1="6" x2="3.01" y2="6"></line>
                  <line x1="3" y1="12" x2="3.01" y2="12"></line>
                  <line x1="3" y1="18" x2="3.01" y2="18"></line>
                </svg>
              </button>
              <button class="toolbar-btn" data-command="insertOrderedList" title="Numbered List">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="10" y1="6" x2="21" y2="6"></line>
                  <line x1="10" y1="12" x2="21" y2="12"></line>
                  <line x1="10" y1="18" x2="21" y2="18"></line>
                  <path d="M4 6h1v4"></path>
                  <path d="M4 10h2"></path>
                  <path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"></path>
                </svg>
              </button>
            </div>

            <div class="toolbar-divider"></div>

            <div class="toolbar-group">
              <button class="toolbar-btn" data-command="createLink" title="Insert Link">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                  <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                </svg>
              </button>
              <button class="toolbar-btn" id="imageBtn" title="Insert Image">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                  <circle cx="8.5" cy="8.5" r="1.5"></circle>
                  <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
              </button>
              <input type="file" id="imageInput" accept="image/*" style="display: none;">
            </div>
          </div>

          <div id="editor" contenteditable="true" class="editor" placeholder="Start writing your post..."></div>
        </div>

        <div class="editor-footer">
          <button id="clearBtn" class="btn btn-ghost">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            Clear
          </button>
        </div>
      </div>
    </main>
  </div>

  <div id="previewModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Markdown Preview</h2>
        <button class="close-btn" id="closePreview">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <pre id="markdownPreview"></pre>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="copyMarkdown">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          Copy
        </button>
      </div>
    </div>
  </div>

  <script src="editor.js"></script>
</body>
</html>
